name: Verify Noah's Arkade
on:
  push:
  pull_request:
jobs:
  phase-one:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/audio.js
          node --check src/globe.js
          node --check src/painted-menu.js
          node --check src/prototype.js
      - name: Verify menu logic and original-art checksum
        run: npm test
      - name: Prepare exact GitHub Pages output for browser testing
        run: |
          mkdir -p public
          cp index.html public/
          cp -R assets src public/
          node scripts/build-approved-art.mjs
      - name: Install browser test runner
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke tests (menu, animal selection and arena)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public > /tmp/arkade-server.log 2>&1 &
          node tests/browser.smoke.mjs
      - name: Upload screenshots (even if tests fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
