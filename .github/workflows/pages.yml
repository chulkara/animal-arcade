name: Publish Noah's Arkade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify original artwork and prepare static site
        run: |
          test -f index.html
          test -f src/painted-menu.js
          test -f src/painted-menu.css
          node --test tests/painted-menu.test.mjs
          mkdir -p public
          cp index.html public/
          cp -R assets src public/
          node scripts/build-approved-art.mjs
          test -s public/assets/approved-menu.png
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
